<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CLIConductor</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#e6edf3;display:flex;overflow:hidden}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

  /* ── Sidebar ── */
  #sidebar{width:240px;min-width:240px;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;height:100%}
  #sidebar h1{font-size:1rem;padding:12px 14px;color:#58a6ff;border-bottom:1px solid #21262d}
  #newSessBtn{margin:8px 10px;padding:6px 0;border:1px dashed #30363d;border-radius:6px;background:transparent;color:#8b949e;cursor:pointer;font-size:.8rem}
  #newSessBtn:hover{border-color:#58a6ff;color:#58a6ff;background:#58a6ff08}
  #sessionList{flex:1;overflow-y:auto;padding:4px 0}
  .sess-item{padding:8px 14px;cursor:pointer;border-left:3px solid transparent;transition:.1s}
  .sess-item:hover{background:#1c2128}
  .sess-item.active{background:#1c2128;border-left-color:#58a6ff}
  .sess-item .sess-name{font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:6px}
  .sess-item .sess-preview{font-size:.75rem;color:#8b949e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .sess-item .sess-meta{font-size:.7rem;color:#484f58;margin-top:2px;display:flex;gap:6px;align-items:center}
  .sess-item .sess-model{background:#21262d;padding:0 5px;border-radius:3px;font-size:.65rem;color:#8b949e}
  .sess-item .sess-count{color:#484f58;font-size:.75rem}

  .s-dot{display:inline-block;width:8px;height:8px;border-radius:50%}
  .s-dot.idle{background:#58a6ff}.s-dot.running{background:#3fb950}.s-dot.held{background:#f0883e}.s-dot.error{background:#f85149}.s-dot.offline{background:#8b949e}

  /* ── Chat area ── */
  #chat{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
  #topBar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #30363d;min-height:48px;flex-wrap:wrap}
  #topBar .chat-name{font-size:.95rem;font-weight:500}
  #topBar .chat-model{font-size:.7rem;background:#21262d;padding:2 6px;border-radius:4px;color:#8b949e}
  #topBar .chat-status{font-size:.7rem;color:#484f58;margin-left:auto}
  #topBar .chat-empty{color:#484f58;font-size:.8rem}
  #settingsBtn{padding:4px 8px;border:1px solid #30363d;border-radius:4px;background:transparent;color:#8b949e;cursor:pointer;font-size:.8rem}
  #settingsBtn:hover{border-color:#58a6ff;color:#58a6ff}
  #settingsBtn.open{background:#58a6ff11;border-color:#58a6ff;color:#58a6ff}

  /* ── Messages ── */
  #messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
  .msg{padding:6px 12px;border-radius:8px;max-width:85%;line-height:1.5;font-size:.85rem;white-space:pre-wrap;word-break:break-word;margin:2px 0}
  .msg.user{background:#1f6feb22;align-self:flex-end;border:1px solid #1f6feb33;color:#e6edf3}
  .msg.assistant{background:#21262d;align-self:flex-start;border:1px solid #30363d;color:#e6edf3}
  .msg.thinking{background:#21262d44;align-self:flex-start;border-left:3px solid #d2a8ff;font-size:.8rem;color:#d2a8ff;padding:6px 12px;cursor:pointer}
  .msg.tool{background:#21262d44;align-self:flex-start;border-left:3px solid #ffa657;font-size:.8rem;color:#ffa657}
  .msg.system{background:transparent;align-self:center;font-size:.75rem;color:#484f58;padding:4px 8px}
  .msg .thinking-body{display:none;margin-top:4px;padding:6px 8px;background:#0d1117;border-radius:4px;color:#d2a8ff;font-size:.8rem}
  .msg .thinking-body.open{display:block}
  .msg .thinking-toggle{color:#d2a8ff88;font-size:.7rem;margin-left:4px}
  .msg .thinking-toggle:hover{color:#d2a8ff}
  .empty-chat{color:#484f58;font-size:.85rem;text-align:center;margin-top:40px}

  /* ── Settings panel ── */
  #settingsPanel{display:none;padding:8px 16px;border-bottom:1px solid #30363d;background:#161b22}
  #settingsPanel.open{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #settingsPanel select,#settingsPanel input{padding:3px 6px;border:1px solid #30363d;border-radius:4px;background:#0d1117;color:#e6edf3;font-size:.75rem;max-width:130px}
  #settingsPanel select:focus,#settingsPanel input:focus{outline:none;border-color:#58a6ff}
  #settingsPanel .btn{padding:3px 8px;border:1px solid #30363d;border-radius:4px;font-size:.7rem;cursor:pointer;background:#21262d;color:#e6edf3}
  #settingsPanel .btn:hover{background:#30363d}
  #settingsPanel .btn-p{border-color:#58a6ff;color:#58a6ff}
  #settingsPanel .btn-p:hover{background:#58a6ff11}
  #settingsPanel .btn-d{border-color:#f85149;color:#f85149}
  #settingsPanel .btn-d:hover{background:#f8514911}
  #settingsPanel .model-custom{display:none;max-width:100px}
  #settingsPanel .sep{width:1px;height:20px;background:#30363d}
  #settingsPanel label{font-size:.7rem;color:#8b949e}

  /* ── Input ── */
  #inputRow{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #30363d;align-items:center}
  #inputRow input{flex:1;padding:8px 12px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#e6edf3;font-size:.85rem}
  #inputRow input:focus{outline:none;border-color:#58a6ff}
  #inputRow button{padding:8px 16px;border:1px solid #58a6ff;border-radius:8px;background:#58a6ff22;color:#58a6ff;cursor:pointer;font-size:.85rem;white-space:nowrap}
  #inputRow button:hover{background:#58a6ff44}

  .toast{position:fixed;bottom:20px;right:20px;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px 16px;font-size:.8rem;color:#e6edf3;opacity:0;transition:opacity .3s;z-index:999;max-width:400px}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div id="sidebar">
  <h1>CLIConductor</h1>
  <button id="newSessBtn" onclick="newSession()">+ New Session</button>
  <div id="sessionList"></div>
</div>

<div id="chat">
  <div id="topBar">
    <span class="chat-empty" id="emptyHint">Select a session</span>
    <span class="chat-name" id="chatName" style="display:none"></span>
    <span class="chat-model" id="chatModel" style="display:none"></span>
    <span id="chatStatus" class="chat-status"></span>
    <button id="settingsBtn" onclick="toggleSettings()" style="display:none">⚙</button>
  </div>

  <div id="settingsPanel">
    <label>Model</label>
    <select id="settingModel"></select>
    <input id="settingModelCustom" class="model-custom" placeholder="custom">
    <button class="btn btn-p" onclick="applyModel()">Set</button>
    <div class="sep"></div>
    <label>Mode</label>
    <select id="settingMode">
      <option value="">mode…</option>
      <option value="default">default</option>
      <option value="acceptEdits">acceptEdits</option>
      <option value="bypassPermissions">bypass</option>
      <option value="plan">plan</option>
      <option value="dontAsk">dontAsk</option>
    </select>
    <button class="btn btn-p" onclick="applyMode()">Set</button>
    <div class="sep"></div>
    <button class="btn" onclick="restartWorker()">Restart</button>
    <button class="btn" onclick="interruptWorker()">Interrupt</button>
    <button class="btn btn-p" onclick="takeover()">Takeover</button>
    <button class="btn btn-d" onclick="killWorker()">Kill</button>
  </div>

  <div id="messages"></div>

  <div id="inputRow">
    <input id="chatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── State ──
var allModels = [];
var defaultModel = 'deepseek-v4-flash';
var currentSessionId = null;  // ses_ uuid
var currentWorkerId = null;
var modelData = [];           // cache of sessions from API

// ── WebSocket ──
var ws = new WebSocket('ws://' + location.host + '/ws');
ws.onopen = refreshSessions;
ws.onmessage = onWsMessage;

function onWsMessage(e) {
  var d = JSON.parse(e.data);
  switch (d.type) {
    case 'worker.spawned':
    case 'worker.restarted':
    case 'worker.reconfigured':
      _setLocalWorker(d.sessionId, d.workerId, 'idle');
      if (d.sessionId === currentSessionId) {
        currentWorkerId = d.workerId;
        updateTopBar();
      }
      refreshSessions();
      break;
    case 'worker.destroyed':
      _setLocalWorker(d.sessionId, null, null);
      if (d.sessionId === currentSessionId) {
        currentWorkerId = null;
        updateTopBar();
      }
      refreshSessions();
      break;
    case 'worker.stream':
      if (d.sessionId === currentSessionId) appendEvent(d.event);
      break;
    case 'worker.result':
      if (d.sessionId === currentSessionId) appendResult(d);
      refreshSessions();
      break;
    case 'worker.status':
      _setLocalWorker(d.sessionId, d.workerId, d.status);
      if (d.sessionId === currentSessionId) updateTopBar();
      refreshSessions();
      break;
    case 'session.created':
    case 'session.renamed':
    case 'session.deleted':
      refreshSessions();
      break;
    case 'error':
      toast(d.message);
      break;
  }
}

// ── Instant local state update (before server sync) ──
function _setLocalWorker(sessionId, workerId, status) {
  for (var i = 0; i < modelData.length; i++) {
    if (modelData[i].id === sessionId) {
      modelData[i].workerId = workerId;
      modelData[i].workerStatus = status;
      break;
    }
  }
  renderSessionList();
}

// ── Session list ──
function refreshSessions() {
  fetch('/api/sessions').then(function(r) { return r.json(); }).then(function(data) {
    modelData = data.sessions || [];
    renderSessionList();
    // re-sync current session if it exists
    var matched = modelData.find(function(s) { return s.id === currentSessionId; });
    if (!matched) {
      currentSessionId = null;
      currentWorkerId = null;
      showEmpty();
    } else {
      // update workerId from server data
      currentWorkerId = matched.workerId || null;
      // re-render messages if we have chat open
      if (document.getElementById('chatName').style.display !== 'none') {
        renderMessages(matched.history || []);
      }
    }
    }
    if (currentSessionId) updateTopBar();
  });
}

function renderSessionList() {
  var el = document.getElementById('sessionList');
  el.innerHTML = '';
  modelData.forEach(function(s) {
    var div = document.createElement('div');
    div.className = 'sess-item' + (s.id === currentSessionId ? ' active' : '');
    div.onclick = function(e) {
      if (e.target.closest('.sess-del')) return;
      selectSession(s.id);
    };

    var lastMsg = '';
    var h = s.history || [];
    if (h.length > 0) {
      var last = h[h.length - 1];
      lastMsg = last.content || '';
      if (lastMsg.length > 40) lastMsg = lastMsg.slice(0, 40) + '…';
    }

    div.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:start">' +
      '<div class="sess-name"><span class="s-dot ' + (s.workerStatus || 'offline') + '"></span>' + esc(s.name) + '</div>' +
      '<button class="sess-del" onclick="deleteSession(\'' + s.id + '\')" title="Delete session" style="background:none;border:none;color:#484f58;cursor:pointer;font-size:.85rem;padding:0 2px">⚙</button>' +
      '</div>' +
      (lastMsg ? '<div class="sess-preview">' + esc(lastMsg) + '</div>' : '') +
      '<div class="sess-meta"><span class="sess-model">' + esc(s.model || defaultModel) + '</span>' +
      '<span>' + (s.history || []).length + ' msgs</span></div>';
    el.appendChild(div);
  });
}

function selectSession(id) {
  currentSessionId = id;
  var s = modelData.find(function(x) { return x.id === id; });
  if (!s) return;

  // find worker if exists
  currentWorkerId = s.workerId || null;

  renderSessionList();
  updateTopBar();
  renderMessages(s.history || []);
  document.getElementById('settingsBtn').style.display = '';
}

// ── Top bar ──
function updateTopBar() {
  var s = modelData.find(function(x) { return x.id === currentSessionId; });
  if (!s) { showEmpty(); return; }
  document.getElementById('emptyHint').style.display = 'none';
  document.getElementById('chatName').style.display = '';
  document.getElementById('chatModel').style.display = '';
  document.getElementById('chatName').textContent = s.name || currentSessionId.slice(0,12);
  document.getElementById('chatModel').textContent = s.model || defaultModel;
  var status = s.workerStatus || 'offline';
  document.getElementById('chatStatus').textContent = status + (currentWorkerId ? ' (' + currentWorkerId + ')' : ' (no worker)');
  // sync settings panel
  syncSettingsPanel(s);
}

function showEmpty() {
  document.getElementById('emptyHint').style.display = '';
  document.getElementById('chatName').style.display = 'none';
  document.getElementById('chatModel').style.display = 'none';
  document.getElementById('chatStatus').textContent = '';
  document.getElementById('settingsBtn').style.display = 'none';
  document.getElementById('settingsPanel').className = '';
  document.getElementById('messages').innerHTML = '<div class="empty-chat">Select a session to start</div>';
}

// ── Messages ──
function renderMessages(history) {
  var el = document.getElementById('messages');
  el.innerHTML = '';
  if (!history || history.length === 0) {
    el.innerHTML = '<div class="empty-chat">No messages yet. Start a conversation.</div>';
    return;
  }
  history.forEach(function(h) {
    addMessage(h.role, h.content);
  });
  el.scrollTop = el.scrollHeight;
}

function addMessage(role, content) {
  var el = document.getElementById('messages');
  var div = document.createElement('div');
  if (role === 'user') {
    div.className = 'msg user';
    div.textContent = content;
  } else if (role === 'assistant') {
    // check if there's a preceding thinking block
    div.className = 'msg assistant';
    // strip tool calls from display
    var display = content.replace(/🔧.*(\n|$)/g, '').trim();
    div.textContent = display || '(tool call only)';
  } else if (role === 'thinking') {
    div.className = 'msg thinking';
    div.innerHTML = '💭 <span class="thinking-toggle">show thinking</span><div class="thinking-body">' + esc(content) + '</div>';
    div.onclick = function() {
      var body = div.querySelector('.thinking-body');
      var toggle = div.querySelector('.thinking-toggle');
      body.classList.toggle('open');
      toggle.textContent = body.classList.contains('open') ? 'hide thinking' : 'show thinking';
    };
  } else if (role === 'tool') {
    div.className = 'msg tool';
    div.textContent = '🔧 ' + content;
  } else {
    div.className = 'msg system';
    div.textContent = content || '';
  }
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function appendEvent(event) {
  var t = event.type;
  if (t === 'system' && event.subtype === 'init') return;
  if (t === 'result') return;

  if (t === 'assistant') {
    var content = (event.message && event.message.content) || [];
    content.forEach(function(b) {
      if (b.type === 'text') addMessage('assistant', b.text);
      else if (b.type === 'thinking') addMessage('thinking', b.thinking);
      else if (b.type === 'tool_use') addMessage('tool', b.name + '(' + JSON.stringify(b.input || {}) + ')');
    });
  }
}

function appendResult(d) {
  var status = d.status === 'error' ? 'error' : 'done';
  addMessage('system', '[' + status.toUpperCase() + '] Task completed');
}

// ── Settings panel ──
function toggleSettings() {
  var panel = document.getElementById('settingsPanel');
  var btn = document.getElementById('settingsBtn');
  var isOpen = panel.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
}

function syncSettingsPanel(s) {
  var sel = document.getElementById('settingModel');
  if (sel.getAttribute('data-loaded') !== '1') return; // first call, skip
  sel.value = allModels.indexOf(s.model || defaultModel) >= 0 ? (s.model || defaultModel) : '';
  document.getElementById('settingMode').value = s.permissionMode || '';
}

function getSettingModel() {
  var sel = document.getElementById('settingModel');
  if (sel.value === '__custom__') {
    var inp = document.getElementById('settingModelCustom');
    return inp.value.trim() || defaultModel;
  }
  return sel.value || defaultModel;
}

function applyModel() {
  if (!currentWorkerId) return toast('No worker running');
  var model = getSettingModel();
  fetch('/api/worker/' + currentWorkerId + '/switch-model', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:model})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) toast(d.error); else refreshSessions();
  });
}

function applyMode() {
  if (!currentWorkerId) return toast('No worker running');
  var mode = document.getElementById('settingMode').value;
  if (!mode) return toast('Select a mode');
  fetch('/api/worker/' + currentWorkerId + '/switch-mode', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({permissionMode:mode})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) toast(d.error); else refreshSessions();
  });
}

function restartWorker() {
  if (currentWorkerId) {
    fetch('/api/worker/' + currentWorkerId + '/restart', {method:'POST'}).then(function(r) { return r.json(); }).then(function(d) {
      if (d.error) toast(d.error);
    });
  } else {
    // no worker: spawn one with current settings
    var model = getSettingModel();
    var mode = document.getElementById('settingMode').value;
    var body = {sessionId: currentSessionId, model: model};
    if (mode) body.permissionMode = mode;
    fetch('/api/spawn', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})
      .then(function(r) { return r.json(); }).then(function(d) {
        if (d.error) toast('Spawn failed: ' + d.error);
      });
  }
}

function interruptWorker() {
  if (!currentWorkerId) return toast('No worker running');
  fetch('/api/worker/' + currentWorkerId + '/interrupt', {method:'POST'}).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) toast(d.error);
  });
}

function takeover() {
  if (!currentWorkerId) return toast('No worker running');
  fetch('/api/worker/' + currentWorkerId + '/takeover', {method:'POST'}).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) return toast(d.error);
    navigator.clipboard.writeText('cbc --resume ' + d.cbcSessionId).then(function() {
      toast('PowerShell opened. Session copied to clipboard.');
    }).catch(function() {
      toast('PowerShell opened for takeover.');
    });
  });
}

function killWorker() {
  if (!currentWorkerId) return toast('No worker running');
  if (!confirm('Kill worker ' + currentWorkerId + '?')) return;
  fetch('/api/kill/' + currentWorkerId, {method:'POST'}).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) toast(d.error);
  });
}

// ── Send message ──
function send() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text || !currentSessionId) return;
  input.value = '';

  // show user message locally
  addMessage('user', text);

  // helper: actually send via WS
  function doSend() {
    ws.send(JSON.stringify({type:'user_inject', sessionId:currentSessionId, text:text}));
  }

  // if no worker, spawn first with settings panel's model/mode
  if (!currentWorkerId) {
    var model = getSettingModel();
    var mode = document.getElementById('settingMode').value;
    var body = {sessionId: currentSessionId, model: model};
    if (mode) body.permissionMode = mode;
    fetch('/api/spawn', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.error) return toast('Spawn failed: ' + d.error);
      currentWorkerId = d.workerId;
      doSend();
    });
    return;
  }

  doSend();
}

// ── New Session ──
function newSession() {
  var name = 'session-' + (modelData.length + 1);
  var n = 1;
  while (modelData.find(function(s) { return s.name === name; })) {
    name = 'session-' + (modelData.length + n);
    n++;
  }
  // only create session, don't spawn worker yet
  fetch('/api/sessions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name})})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) return toast(d.error);
      refreshSessions();
      selectSession(d.id);
    });
}

function deleteSession(id) {
  if (!confirm('Delete session ' + id.slice(0,12) + '…?')) return;
  fetch('/api/sessions/' + id, {method:'DELETE'}).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) return toast(d.error);
    if (currentSessionId === id) {
      currentSessionId = null;
      currentWorkerId = null;
      showEmpty();
    }
    refreshSessions();
  });
}

// ── Init ──
function init() {
  // load models
  fetch('/api/models').then(function(r) { return r.json(); }).then(function(data) {
    allModels = data.models || [];
    defaultModel = data.default || 'deepseek-v4-flash';
    buildModelSelect();
  });
  refreshSessions();
}

function buildModelSelect() {
  var sel = document.getElementById('settingModel');
  sel.innerHTML = '';
  var blank = document.createElement('option'); blank.value = ''; blank.textContent = '— model —'; sel.appendChild(blank);
  allModels.forEach(function(m) {
    var opt = document.createElement('option'); opt.value = m; opt.textContent = m; sel.appendChild(opt);
  });
  var cust = document.createElement('option'); cust.value = '__custom__'; cust.textContent = '✎ custom…'; sel.appendChild(cust);
  sel.onchange = function() {
    document.getElementById('settingModelCustom').style.display = sel.value === '__custom__' ? 'inline-block' : 'none';
  };
  sel.setAttribute('data-loaded', '1');
}

function esc(s) {
  var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  setTimeout(function() { el.className = 'toast'; }, 3000);
}

init();
</script>
</body>
</html>
