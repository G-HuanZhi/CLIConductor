<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CLIConductor</title>
<link rel="stylesheet" href="/static/css/styles.css?v=2">
</head>
<body>

<div id="sidebar">
  <h1>CLIConductor</h1>
  <button id="newSessBtn" onclick="newSession()">+ New Session</button>
  <div id="sessionList"></div>
</div>

<div id="chat">
  <div id="topBar">
    <span class="chat-empty" id="emptyHint">Select a session</span>
    <span class="chat-name" id="chatName" style="display:none"></span>
    <span class="chat-model" id="chatModel" style="display:none"></span>
    <span id="chatStatus" class="chat-status"></span>
    <button id="settingsBtn" onclick="toggleSettings()" style="display:none">⚙</button>
  </div>

  <div id="settingsPanel">
    <label>Model</label>
    <select id="settingModel" onchange="updateSetButtonVisibility()"></select>
    <input id="settingModelCustom" class="model-custom" placeholder="custom">
    <div class="sep"></div>
    <label>Mode</label>
    <select id="settingMode" onchange="updateSetButtonVisibility()"></select>
    <div class="sep"></div>
    <label for="settingThinking">Think</label>
    <input type="checkbox" id="settingThinking" onchange="onThinkingToggle()">
    <span id="effortGroup" style="display:none">
      <label for="settingEffort">Effort</label>
      <select id="settingEffort" onchange="updateSetButtonVisibility()"></select>
    </span>
    <div class="sep"></div>
    <button id="applySettingsBtn" class="btn btn-p" style="display:none" onclick="applySettings()">Apply Settings</button>
    <div class="sep"></div>
    <button class="btn" onclick="restartWorker()">Restart</button>
    <button class="btn" onclick="interruptWorker()">Interrupt</button>
    <button class="btn btn-p" onclick="takeover()">Takeover</button>
    <button class="btn btn-d" onclick="killWorker()">Kill</button>
  </div>

  <div id="messages"></div>

  <div id="inputRow">
    <input id="chatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')send()">
    <span id="mobileWorkerDot" class="s-dot offline"></span>
    <button type="button" onclick="send()"><span style="pointer-events:none">Send</span></button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/static/js/app.js?v=2"></script>
</body>
</html>
