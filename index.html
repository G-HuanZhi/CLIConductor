<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CLIConductor Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0d1117;color:#e6edf3;padding:20px}
  h1{font-size:1.5rem;margin-bottom:16px;color:#58a6ff}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
  .toolbar input{padding:6px 10px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#e6edf3;font-size:.875rem}
  .toolbar input:focus{outline:none;border-color:#58a6ff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:12px}
  .card{border:1px solid #30363d;border-radius:8px;background:#161b22;padding:12px;display:flex;flex-direction:column}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:4px}
  .card-header h2{font-size:1rem;color:#e6edf3}
  .card-header .meta{font-size:.75rem;color:#8b949e}
  .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
  .idle{background:#8b949e}.running{background:#3fb950}.done{background:#58a6ff}.error{background:#f85149}
  .btn{padding:4px 10px;border:1px solid #30363d;border-radius:6px;font-size:.75rem;cursor:pointer;background:#21262d;color:#e6edf3}
  .btn:hover{background:#30363d}
  .btn-danger{border-color:#f85149;color:#f85149}
  .btn-danger:hover{background:#f8514911}
  .btn-primary{border-color:#58a6ff;color:#58a6ff}
  .btn-primary:hover{background:#58a6ff11}
  .controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
  .controls input,.controls select{padding:3px 6px;border:1px solid #30363d;border-radius:4px;background:#0d1117;color:#e6edf3;font-size:.75rem;max-width:120px}
  .controls input:focus,.controls select:focus{outline:none;border-color:#58a6ff}
  .log{border:1px solid #21262d;border-radius:6px;background:#0d1117;padding:8px;height:280px;overflow-y:auto;font-family:monospace;font-size:.8rem;line-height:1.5;margin-bottom:8px;flex:1}
  .log .msg{margin:2px 0;white-space:pre-wrap;word-break:break-word}
  .log .u{color:#7ee787}.log .th{color:#d2a8ff}.log .tx{color:#e6edf3}.log .tl{color:#ffa657}.log .err{color:#f85149}
  .log .sys{margin:4px 0;padding:2px 6px;background:#161b22;border-radius:4px;font-size:.7rem;color:#8b949e}
  .inject-row{display:flex;gap:6px}
  .inject-row input{flex:1;padding:6px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#e6edf3;font-size:.8rem}
  .inject-row input:focus{outline:none;border-color:#58a6ff}
  .empty{color:#8b949e;font-size:.8rem;font-style:italic}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
  .toast{position:fixed;bottom:20px;right:20px;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px 16px;font-size:.8rem;color:#e6edf3;opacity:0;transition:opacity .3s}
  .toast.show{opacity:1}
</style>
</head>
<body>

<h1>⚡ CLIConductor</h1>

<div class="toolbar" style="flex-direction:column;align-items:stretch;gap:6px">
  <div style="display:flex;gap:8px;align-items:center">
    <span style="font-weight:600;white-space:nowrap">+ New Worker</span>
    <input id="newName" placeholder="name" value="worker" style="flex:1;min-width:80px">
    <button class="btn btn-primary" onclick="spawn()" style="white-space:nowrap">+ Spawn</button>
    <span id="workerCount" style="font-size:.8rem;color:#8b949e;white-space:nowrap">0 workers</span>
  </div>
  <div class="controls" style="margin-bottom:0">
    <select id="spawnModel" onchange="onSpawnModelChange()"></select>
    <input id="spawnModelCustom" placeholder="custom model" style="display:none;max-width:140px">
    <select id="spawnMode">
      <option value="">mode…</option>
      <option value="default">default</option>
      <option value="acceptEdits">acceptEdits</option>
      <option value="bypassPermissions">bypass</option>
      <option value="plan">plan</option>
      <option value="dontAsk">dontAsk</option>
    </select>
    <input id="spawnWorkdir" placeholder="workdir (auto)" style="max-width:200px">
  </div>
</div>

<div id="grid" class="grid"></div>

<div id="toast" class="toast"></div>

<script>
// ── Model list (populated from API) ──
var allModels = [];
var defaultModel = 'deepseek-v4-flash';

// ── WebSocket ──
var ws = new WebSocket('ws://' + location.host + '/ws');
ws.onopen = () => { fetchWorkers(); };
ws.onmessage = function(e) {
  var d = JSON.parse(e.data);
  switch (d.type) {
    case 'worker.spawned':   addCard(d); break;
    case 'worker.stream':    appendEvent(d.workerId, d.event); break;
    case 'worker.result':    onResult(d); break;
    case 'worker.status':    setStatus(d.workerId, d.status); break;
    case 'worker.destroyed': removeCard(d.workerId); break;
    case 'worker.restarted':
    case 'worker.reconfigured': setStatus(d.workerId, d.status); break;
    case 'worker.renamed':   updateName(d.workerId, d.newName); break;
    case 'error':            toast(d.message); break;
  }
};

// ── Fetch current state on reconnect ──
function fetchWorkers() {
  fetch('/api/models').then(r => r.json()).then(data => {
    allModels = data.models || [];
    defaultModel = data.default || 'deepseek-v4-flash';
    // re-populate any existing model selects
    document.querySelectorAll('[id^="model-"]').forEach(sel => rebuildModelSelect(sel.id.replace('model-', '')));
    rebuildSpawnModel();
  });
  fetch('/api/list').then(r => r.json()).then(data => {
    clearGrid();
    (data.workers || []).forEach(w => {
      addCard({workerId: w.workerId, name: w.name, status: w.status,
               sessionId: w.sessionId, model: w.model,
               permissionMode: w.permissionMode, workdir: w.workdir});
    });
  });
}

// ── Worker card ──
function addCard(d) {
  var id = d.workerId;
  if (document.getElementById('c-' + id)) return;

  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'c-' + id;

  card.innerHTML = `
    <div class="card-header">
      <div>
        <h2 id="title-${id}"><span id="dot-${id}" class="status-dot idle"></span>${esc(d.name)}</h2>
        <div class="meta" id="meta-${id}">
          ${d.workerId}
          ${d.sessionId ? ' · session: ' + d.sessionId.slice(0,8)+'…' : ''}
          ${d.model ? ' · ' + esc(d.model) : ''}
          ${d.workdir ? ' · ' + esc(d.workdir) : ''}
        </div>
      </div>
      <div class="controls">
        <button class="btn" onclick="restart('${id}')">Restart</button>
        <button class="btn" onclick="interrupt('${id}')">Interrupt</button>
        <button class="btn" onclick="takeover('${id}')">Takeover</button>
        <button class="btn btn-danger" onclick="kill('${id}')">Kill</button>
      </div>
    </div>
    <div class="controls">
      <select id="model-${id}" data-current="${d.model || ''}" onchange="onModelChange('${id}')"></select>
      <input id="model-custom-${id}" placeholder="custom model" style="display:none;max-width:140px">
      <button class="btn btn-primary" onclick="switchModel('${id}')">Model</button>
      <select id="mode-${id}">
        <option value="">mode…</option>
        <option value="default">default</option>
        <option value="acceptEdits">acceptEdits</option>
        <option value="bypassPermissions">bypass</option>
        <option value="plan">plan</option>
        <option value="dontAsk">dontAsk</option>
      </select>
      <button class="btn" onclick="switchMode('${id}')">Mode</button>
      <input id="rename-${id}" placeholder="new name" value="">
      <button class="btn" onclick="rename('${id}')">Rename</button>
      <input id="branch-${id}" placeholder="branch name" value="">
      <button class="btn" onclick="branch('${id}')">Branch</button>
    </div>
    <div class="log" id="log-${id}">
      <div class="msg sys">Worker created (${d.workerId})</div>
    </div>
    <div class="inject-row">
      <input id="inject-${id}" placeholder="Type a message to inject…">
      <button class="btn btn-primary" onclick="inject('${id}')">Send</button>
    </div>
  `;

  document.getElementById('grid').appendChild(card);
  rebuildModelSelect(id);
  updateCount();
}

function removeCard(id) {
  var el = document.getElementById('c-' + id);
  if (el) el.remove();
  updateCount();
}

function clearGrid() {
  document.getElementById('grid').innerHTML = '';
  updateCount();
}

function updateCount() {
  var n = document.getElementById('grid').children.length;
  document.getElementById('workerCount').textContent = n + ' worker' + (n !== 1 ? 's' : '');
}

function updateName(id, newName) {
  var el = document.getElementById('title-' + id);
  if (el) el.innerHTML = '<span id="dot-'+id+'" class="status-dot idle"></span>' + esc(newName);
}

// ── Model select helpers ──
function rebuildModelSelect(id) {
  var sel = document.getElementById('model-' + id);
  if (!sel) return;
  var current = sel.getAttribute('data-current') || '';
  sel.innerHTML = '';
  // blank option
  var blank = document.createElement('option');
  blank.value = ''; blank.textContent = '— model —';
  sel.appendChild(blank);
  // all known models
  allModels.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    if (m === current || m === defaultModel && !current) opt.selected = true;
    sel.appendChild(opt);
  });
  // custom option
  var custom = document.createElement('option');
  custom.value = '__custom__';
  custom.textContent = '✎ custom…';
  sel.appendChild(custom);
  // show custom input if needed
  if (current && allModels.indexOf(current) === -1) {
    sel.value = '__custom__';
    var inp = document.getElementById('model-custom-' + id);
    if (inp) { inp.value = current; inp.style.display = 'inline-block'; }
  }
}

function onModelChange(id) {
  var sel = document.getElementById('model-' + id);
  var inp = document.getElementById('model-custom-' + id);
  if (!sel || !inp) return;
  inp.style.display = sel.value === '__custom__' ? 'inline-block' : 'none';
  if (sel.value !== '__custom__') inp.value = '';
}

function getModelValue(id) {
  var sel = document.getElementById('model-' + id);
  if (!sel) return '';
  if (sel.value === '__custom__') {
    var inp = document.getElementById('model-custom-' + id);
    return inp ? inp.value.trim() : '';
  }
  return sel.value;
}

// ── Spawn model select ──
function rebuildSpawnModel() {
  var sel = document.getElementById('spawnModel');
  if (!sel) return;
  sel.innerHTML = '';
  // default option
  var def = document.createElement('option');
  def.value = ''; def.textContent = 'default (' + defaultModel + ')';
  sel.appendChild(def);
  // all models
  allModels.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    if (m === defaultModel) opt.selected = true;
    sel.appendChild(opt);
  });
  // custom
  var c = document.createElement('option');
  c.value = '__custom__'; c.textContent = '✎ custom…';
  sel.appendChild(c);
}

function onSpawnModelChange() {
  var sel = document.getElementById('spawnModel');
  var inp = document.getElementById('spawnModelCustom');
  if (!sel || !inp) return;
  inp.style.display = sel.value === '__custom__' ? 'inline-block' : 'none';
  if (sel.value !== '__custom__') inp.value = '';
}

function getSpawnModel() {
  var sel = document.getElementById('spawnModel');
  if (!sel) return defaultModel;
  if (sel.value === '__custom__') {
    var inp = document.getElementById('spawnModelCustom');
    return inp && inp.value.trim() ? inp.value.trim() : defaultModel;
  }
  return sel.value || defaultModel;
}

// ── Event rendering ──
function appendEvent(id, event) {
  var log = document.getElementById('log-' + id);
  if (!log) return;
  var t = event.type;
  var div;

  if (t === 'system' && event.subtype === 'init') {
    div = document.createElement('div');
    div.className = 'msg sys';
    div.textContent = `[INIT] session: ${event.session_id}  model: ${event.model}`;
  } else if (t === 'assistant') {
    var content = (event.message && event.message.content) || [];
    for (var i = 0; i < content.length; i++) {
      var b = content[i];
      div = document.createElement('div');
      if (b.type === 'text') {
        div.className = 'msg tx';
        div.textContent = b.text;
      } else if (b.type === 'thinking') {
        div.className = 'msg th';
        div.textContent = '💭 ' + b.thinking;
      } else if (b.type === 'tool_use') {
        div.className = 'msg tl';
        div.textContent = '🔧 ' + b.name + '(' + JSON.stringify(b.input || {}) + ')';
      } else {
        continue;
      }
      log.appendChild(div);
    }
    return;
  } else if (t === 'result') {
    return; // handled by onResult
  } else {
    return;
  }

  if (div) log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ── Status updates ──
function onResult(d) {
  setStatus(d.workerId, d.status);
  var log = document.getElementById('log-' + d.workerId);
  if (!log) return;
  var cls = d.status === 'error' ? 'err' : 'tx';
  var div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = '[' + d.status.toUpperCase() + '] ' + JSON.stringify(d.result || '');
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  // update meta with session id
  var meta = document.getElementById('meta-' + d.workerId);
  if (meta && d.sessionId) {
    meta.textContent = meta.textContent.replace(/session: [^·]+/, 'session: ' + d.sessionId.slice(0,8)+'…');
    if (!meta.textContent.includes('session:')) meta.textContent += ' · session: ' + d.sessionId.slice(0,8)+'…';
  }
}

function setStatus(id, s) {
  var dot = document.getElementById('dot-' + id);
  if (dot) { dot.className = 'status-dot ' + s; dot.title = s; }
}

// ── API calls ──
function spawn() {
  var name = document.getElementById('newName').value || 'worker';
  var model = getSpawnModel();
  var mode = document.getElementById('spawnMode').value;
  var workdir = document.getElementById('spawnWorkdir').value.trim() || undefined;
  var body = {name: name, model: model};
  if (mode) body.permissionMode = mode;
  if (workdir) body.workdir = workdir;
  fetch('/api/spawn', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
}

function inject(id) {
  var input = document.getElementById('inject-' + id);
  var text = input.value.trim();
  if (!text) return;
  // show user message locally
  var log = document.getElementById('log-' + id);
  if (log) {
    var div = document.createElement('div');
    div.className = 'msg u';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  ws.send(JSON.stringify({type:'user_inject', workerId:id, text:text}));
  input.value = '';
}

function kill(id) {
  if (!confirm('Kill ' + id + '?')) return;
  fetch('/api/kill/' + id, {method:'POST'});
}

function restart(id) {
  fetch('/api/worker/' + id + '/restart', {method:'POST'}).then(r => r.json()).then(d => {
    if (d.error) toast(d.error);
  });
}

function interrupt(id) {
  fetch('/api/worker/' + id + '/interrupt', {method:'POST'}).then(r => r.json()).then(d => {
    if (d.error) toast(d.error);
  });
}

function switchModel(id) {
  var model = getModelValue(id);
  if (!model) return toast('Select or enter a model');
  fetch('/api/worker/' + id + '/switch-model', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({model:model})}).then(r => r.json()).then(d => {
    if (d.error) toast(d.error);
  });
}

function switchMode(id) {
  var mode = document.getElementById('mode-' + id).value;
  if (!mode) return toast('Select a mode');
  fetch('/api/worker/' + id + '/switch-mode', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({permissionMode:mode})}).then(r => r.json()).then(d => {
    if (d.error) toast(d.error);
  });
}

function rename(id) {
  var name = document.getElementById('rename-' + id).value.trim();
  if (!name) return toast('Enter a name');
  fetch('/api/worker/' + id + '/rename', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name})}).then(r => r.json()).then(d => {
    if (d.error) toast(d.error); else document.getElementById('rename-'+id).value = '';
  });
}

function branch(id) {
  var name = document.getElementById('branch-' + id).value.trim() || undefined;
  fetch('/api/worker/' + id + '/branch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name})}).then(r => r.json()).then(d => {
    if (d.error) toast(d.error); else document.getElementById('branch-'+id).value = '';
  });
}

function takeover(id) {
  fetch('/api/worker/' + id + '/takeover', {method:'POST'}).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) return toast(d.error);
    var cmd = 'cbc --resume ' + d.sessionId;
    navigator.clipboard.writeText(cmd).then(function() {
      toast('PowerShell opened. Session copied:\n' + cmd);
    }).catch(function() {
      toast('PowerShell opened for session:\n' + cmd);
    });
  });
}

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 3000);
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
